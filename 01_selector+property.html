<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS 선택자, 프로퍼티(속성)</title>
    <style>
      /*
        선택자 {
            속성: 값;
        }
        */
      /* 그냥 입력하면 태그 이름 */
      /* #id */
      #brand {
        color: blue;
      }
      /* .class */
      .lead {
        color: green;
      }
      .alert {
        color: red;
      }
      strong {
        color: pink;
      }

      input {
        font-size: 24px;
      }
      input {
        font-size: 48px; /* 같은 우선도면 뒤에 나오는게 덮어씀 */
      }
      input[type="password"] {
        font-size: 18px;
      }
      a {
        text-decoration: none;
      }
      a[href="https://naver.com"]
      {
        text-decoration: line-through;
      }
      a[target="_blank"] {
        text-decoration: underline;
      }

      /* 결합자 */
      .section {
        border: 1px solid black;
      }
      .section .note {
        color: grey;
      } /* 소속된 모든 요소 (꼭 바로 소속된게 아니더라도... 해당 선택자에 속하기만 해도...) */
      .section > .note {
        background-color: lightyellow;
      } /* 바로 속한 경우 -> 중간에 감싸는 것이 있다면 적용 안됨 */
      h3 + p {
        font-style: italic;
        font-weight: bold;
      }
      h3 ~ p {
        border-top: 1px dashed black; /* font-style을 뒤집어 씌움 */
      }
      h3,
      p {
        font-size: 24px;
      }
    </style>
  </head>
  <body>
    <!-- css -> 선택. HTML <-> 별도로 존재가 가능 -->
    <!-- id와 class 같은 꾸며주는 걸로 경합하게 되면 id가 이김 : 특이도, 우선순위 -->
    <h1 id="brand" class="lead">
      구별을 위한 선택자 id, 1개만 존재하는 걸 '권장'
    </h1>
    <p id="brand">그런갑다... 만들 때 신경써 줘야함(????)</p>
    <p class="lead">재사용을 위한 클래스 예시</p>
    <h6 class="lead">재사용했습니다~</h6>
    <p class="alert">경고 경고~</p>
    <strong>정말 쎄보이게 하고 싶다</strong>
    <br />
    <label>
      <input type="text" placeholder="아이디" />
    </label>
    <label>
      <input type="password" placeholder="비밀번호" />
      <input type="password" placeholder="비밀번호" />
      <input type="password" placeholder="비밀번호" />
    </label>
    <p>
      <!-- _blank : 새 창 띄우기 -->
      <a href="https://naver.com" target="_blank">네이버 새 창 링크</a>
      <a href="https://naver.com" target="_self">네이버 현재 탭(창) 바꾸기</a>
    </p>

    <!-- 감싸줄 때 쓴다 -->
    <section class="section">
      <div class="note">나는 .section의 자식(하위, 바로 직계인 경우) .note</div>
      <div>
        <div class="note">
          나는 .section의 자손(바로 직계가 아닌 경우) .note
        </div>
      </div>
      <h3>제목</h3>
      <p>이 단락은 h3 바로 다음</p>
      <p>이 단락은 h3 뒤쪽 모든 형제(~, 같은 요소 소속인 요소들)</p>
    </section>
  </body>
</html>
